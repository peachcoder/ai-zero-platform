spring:
  application:
    name: tao-ai-code-mother-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai-code-mother
    username: root
    password: root
  profiles:
    active: local
server:
  port: 8123
